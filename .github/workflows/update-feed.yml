name: Update feed

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Chromium は毎回ダウンロードすると1分近くかかるのでキャッシュする。
      - name: Cache Puppeteer browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      # 失敗したらここで異常終了し、既存の docs/feed.xml は前回のまま残る。
      - name: Build feed
        run: node src/index.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/feed.xml; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git commit -m "chore: update feed"
          git push
